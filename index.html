<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b1620"><meta name="mobile-web-app-capable" content="yes"><script>(function(){try{if(matchMedia("(pointer:coarse)").matches&&window.innerWidth>=800){document.querySelector("meta[name=viewport]").setAttribute("content","width=412,initial-scale=1,viewport-fit=cover");}}catch(e){}})();</script><style>html,body{margin:0;padding:0}[hidden]{display:none!important}body:has(#start[hidden]){padding-bottom:30px}</style></head><body><title>中世紀世界霸權</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap">
<style>
/* 佈局：全螢幕戰略地圖。上方資源列，中間可拖曳縮放的地圖（桌機右側為地區面板，手機在地圖下方），底部指令列。單一深色戰場配色，金色作為唯一強調色。 */
:root{
  --bg:#0a161b; --ink:#ece6d4; --muted:#9db0a8; --line:#33474c;
  --panel:#142227; --panel2:#1c2f35;
  --gold:#d6ad55; --gold2:#f1d48c; --gold-ink:#241a05;
  --sea1:#1a4b5a; --sea2:#0d2b36; --sea3:#07161e;
  --neutral:#9a8e68; --land-edge:#2d2514;
  --rome:#c13c32; --carth:#8250b8; --greek:#2f80d6; --mace:#e08a2e; --egypt:#d8b92f; --seleuc:#2aa391; --syra:#d96a98;
  --good:#8ad487; --bad:#f4796b; --scrim:rgba(3,10,13,.72);
  --f-n:'Oswald','Noto Sans TC',sans-serif;
  --f-b:'Noto Sans TC',system-ui,sans-serif;
  --f-l:'Marcellus','Noto Sans TC',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;overflow:hidden}
h1,h2{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-n);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dot.neu{background:var(--neutral)}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 通用按鈕 */
.btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:46px;padding:8px 12px;
  background:linear-gradient(#2a4249,#1b2f35);border:1px solid #4b666c;border-radius:8px;cursor:pointer;text-align:left;line-height:1.3}
.btn span{font-weight:700}
.btn small{font-size:12px;color:var(--muted)}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:linear-gradient(#e2bd6a,#b78a32);border-color:#f4dc9b;color:var(--gold-ink)}
.btn.primary small{color:var(--gold-ink);opacity:.8}
.btn.on{border-color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.cmd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;min-width:0;
  background:linear-gradient(#2d474f,#1b2f35);border:1px solid #4d6a71;border-bottom-color:#05090b;border-radius:10px;cursor:pointer;text-align:center}
.cmd .ic{color:var(--gold2)}
.cmd b{font-size:13px;font-weight:700;line-height:1.15}
.cmd small{font-size:11px;color:var(--muted);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd:hover:not(:disabled){border-color:var(--gold)}
.cmd.on{border-color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold2)}
.cmd.primary{background:linear-gradient(#e6c373,#b98c33);border-color:#f6e0a4;color:var(--gold-ink)}
.cmd.primary .ic,.cmd.primary small{color:var(--gold-ink)}
.cmd:disabled{opacity:.4;cursor:not-allowed}

/* 開始畫面 */
#start{position:relative;height:100%;overflow:auto}
.startmap{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 55% 45%,var(--sea1) 0%,var(--sea2) 55%,var(--sea3) 100%)}
.startmap::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,16,.9) 0%,rgba(5,12,16,.62) 55%,rgba(5,12,16,.25) 100%)}
.startmap svg{width:100%;height:100%;display:block}
.sc-in{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 40px}
.eyebrow{font-family:var(--f-l);letter-spacing:.3em;font-size:13px;color:var(--gold)}
.sc-in h1{font-size:clamp(40px,10vw,68px);font-weight:900;letter-spacing:.1em;margin-block:6px 10px;
  background:linear-gradient(#f8e3a8,#c99a3e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6))}
.lead{max-width:560px;font-size:16px;color:#d6d2c0;margin-bottom:18px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;min-width:0;cursor:pointer;
  background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 38%,#0e1a1f),#0e1a1f 62%);
  border:1px solid color-mix(in srgb,var(--fc) 55%,#000);border-top:5px solid var(--fc);border-radius:8px}
.fcard:hover{border-color:var(--gold)}
.fname{font-weight:900;font-size:24px;letter-spacing:.06em}
.fblurb{color:#c9cfc3;font-size:14px}
.ftraits{margin:0;padding-left:18px;font-size:14px;flex:1}
.ftraits li{margin-bottom:3px}
.fgo{font-weight:700;color:var(--gold2)}
#cont{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
#cont .btn{width:100%;align-items:center}
.rules{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:rgba(10,22,27,.85);padding:10px 14px}
.rules summary{cursor:pointer;font-weight:700}
.rules ul{margin:8px 0 2px;padding-left:18px;font-size:14px}
.rules li{margin-bottom:4px}

/* 遊戲畫面 */
.app{height:100%;display:flex;flex-direction:column}
.hud{flex:none;background:linear-gradient(#1d3239,#0f1d22);border-bottom:2px solid #000;box-shadow:inset 0 -1px 0 rgba(214,173,85,.45)}
.hud-in{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:8px 4px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.hflag{width:34px;height:30px;flex:none;color:var(--gold)}
.who b{display:block;font-weight:900;font-size:17px;letter-spacing:.06em;line-height:1.2}
.who small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.date{display:flex;align-items:baseline;gap:8px;margin-left:auto}
#yr{font-family:var(--f-n);font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1;white-space:nowrap}
#ssn{white-space:nowrap}
#ssn{font-weight:900;font-size:20px;color:var(--gold2)}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0;flex:1 1 100%}
@media (min-width:900px){.res{flex:1 1 380px;max-width:520px;margin-left:auto}.date{margin-left:0;flex:none}.who{flex:none;min-width:180px}#hint{order:5}}
.rc{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);border:1px solid #3a5259;border-radius:10px;padding:3px 8px 3px 6px;min-width:0}
.rc .ic{width:22px;height:22px;color:var(--gold)}
.rc .v{display:block;font-family:var(--f-n);font-weight:700;font-size:18px;line-height:1.05}
.rc .dl{display:block;font-family:var(--f-n);font-size:11px;line-height:1.1;color:var(--muted);white-space:nowrap}
.dl.up{color:var(--good)} .dl.down{color:var(--bad)}
#hint{flex:1 1 100%;font-size:12px;color:var(--muted);padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
@media (min-width:900px){.stage{flex-direction:row}}
.mapwrap{position:relative;flex:1;min-height:170px;min-width:0}
.mapview{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 42%,var(--sea1) 0%,var(--sea2) 58%,var(--sea3) 100%)}
.mapview:active{cursor:grabbing}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 12px rgba(0,0,0,.62)}
.mapsvg{display:block;width:100%;height:100%}
.legend{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:3px 12px;max-width:calc(100% - 70px);padding:6px 10px;
  background:rgba(8,18,22,.82);border:1px solid rgba(214,173,85,.45);border-radius:8px;font-size:12px}
.zoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;max-height:calc(100% - 20px);gap:6px}
.zb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(8,18,22,.85);border:1px solid rgba(214,173,85,.5);border-radius:8px;cursor:pointer;font-size:22px;font-weight:700;color:var(--gold2);line-height:1}
.zb:hover{border-color:var(--gold2)}
.zb .ic{width:18px;height:18px}
.logbox{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;max-height:62%;overflow:auto;background:rgba(9,20,25,.96);border:1px solid var(--gold);border-radius:10px;padding:8px 14px 12px}
.logbox .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.logbox h2{font-size:15px;letter-spacing:.12em}
.xbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .when{font-size:12px;color:var(--muted);padding-top:2px}
.log .k-good span:last-child{color:var(--good)} .log .k-bad span:last-child{color:var(--bad)}
.panel{contain:paint;flex:none;max-height:40vh;max-height:44dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding-block:10px 24px;background:linear-gradient(#1a2e35,#122027);border-top:2px solid var(--gold)}
@media (min-width:900px){.panel{width:340px;max-height:none;border-top:0;border-left:2px solid var(--gold);padding-block:14px}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ph h2{font-size:20px;font-weight:900;letter-spacing:.04em}
.own{font-size:13px;font-weight:700}
.note{color:var(--muted);font-size:13px;margin:2px 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
.stats div{background:rgba(0,0,0,.28);border-radius:6px;padding:4px 8px;min-width:0}
.stats dt{font-size:11px;color:var(--muted);white-space:nowrap}
.stats dd{margin:0;font-family:var(--f-n);font-weight:700;font-size:16px;line-height:1.3}
.bg.ns .pl{stroke:#ff5a4f;stroke-width:2.4}
.mixbar{display:flex;height:18px;border-radius:5px;overflow:hidden;margin-top:8px;font-size:11px;font-weight:700;color:#10161a}.mixbar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.cmds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mbox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #4b666c;border-radius:8px;overflow:hidden}
.seg button{background:#1b2f35;border:0;padding:10px 8px;min-height:44px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid #4b666c}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}
.mline{font-size:14px}
.odds .num{font-size:28px;font-weight:700;color:var(--gold2)}
.odds small{color:var(--muted)}
.warn{font-size:13px;color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .btn{align-items:center}
.bar{position:relative;z-index:3;flex:none;padding-block:6px max(8px,env(safe-area-inset-bottom,0px));background:linear-gradient(#17292f,#0a1418);border-top:2px solid #000;box-shadow:inset 0 1px 0 rgba(214,173,85,.45)}
.ap{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.apdots{display:inline-flex;gap:6px}
.apbar{display:inline-block;width:56px;height:9px;border-radius:5px;background:rgba(241,212,140,.2);border:1px solid rgba(241,212,140,.5);overflow:hidden}
.apbar i{display:block;height:100%;background:#f1d48c}
.apd{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--gold)}
.apd.on{background:var(--gold)}
.acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.acts .cmd small{font-size:10px}
.acts .cmd b{font-size:13px}
.dip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px;margin-bottom:6px}

/* 地圖（六角格） */
.grat line{stroke:#9fd0dc;stroke-opacity:.05;stroke-width:1}
.sh{fill:#2b7f9a;fill-opacity:.5;stroke:#a6e0ee;stroke-opacity:.2;stroke-width:1}
.sh2{fill:#1f6280;fill-opacity:.42;stroke:#a6e0ee;stroke-opacity:.12;stroke-width:1}
.seanm{pointer-events:none;fill:rgba(200,236,248,.5);font-size:15px;font-style:italic;letter-spacing:6px;font-weight:600}
.seanm.big{font-size:21px}
.flist{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow{display:flex;gap:6px;align-items:center;width:100%}
.frow span:first-child{flex:1;font-size:13px}
.flist b{font-size:13px;color:var(--muted);width:100%}
.sg{fill:none;stroke:#8fc9d8;stroke-opacity:.07;stroke-width:1}
.hx{cursor:pointer;stroke:rgba(0,0,0,.28);stroke-width:1}
.hx:hover{stroke:#fff;stroke-width:2}
.t-g{fill:#8fb05a}.t-f{fill:#3f6b34}.t-h{fill:#a98d4a}.t-m{fill:#7d746b}.t-d{fill:#e0c887}.t-n{fill:#5fae45}.t-s{fill:#c9c06a}
.ov{pointer-events:none;fill-opacity:.52}
.mapsvg.z1 .ov{fill-opacity:.78}
.mapsvg.z1 .bd{stroke-width:6.5}
.mapsvg.z1 .bdk{stroke-width:6}
.fn{pointer-events:none;display:none;font-family:var(--f-b);font-weight:900;letter-spacing:2px;stroke:#05090c;stroke-width:calc(4px * var(--zs));stroke-linejoin:round;paint-order:stroke;filter:brightness(1.7) saturate(1.2)}
.fn.me{stroke:#f1d48c;stroke-width:calc(5px * var(--zs));filter:brightness(1.9)}
.ov.neu{fill:#8a7f60;fill-opacity:.28}
.gl{pointer-events:none;fill:none;stroke:rgba(20,16,6,.6);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gl.f{fill:#173a1a;stroke:#0b1f0c;stroke-width:1}
.gl.tr{stroke:#3b2a14;stroke-width:2}
.gl.m{fill:#4f4640;stroke:#1d1814;stroke-width:1.3}
.gl.pk{fill:#fff;stroke:none;opacity:.9}
.gl.hl2{stroke:#5a4620;stroke-width:2.6}
.gl.dn{stroke:#a98a45;stroke-width:2.4}
.gl.rv{stroke:#1d6aa0;stroke-width:2.6}
.gl.st{stroke:#6d6a22;stroke-width:2.2}
.cst{pointer-events:none;stroke:#0a1a22;stroke-width:3;stroke-linecap:round;fill:none}
.bd{pointer-events:none;stroke-width:4.4;stroke-linecap:round;fill:none;opacity:.95}
.bdk{pointer-events:none;stroke:#05070a;stroke-opacity:.95;stroke-width:4.6;stroke-linecap:round;fill:none}
.hl{pointer-events:none;fill:none;stroke-width:3.2;stroke-linejoin:round}
.hl.land{stroke:#ff8b7a;stroke-dasharray:7 5;fill:#ff8b7a;fill-opacity:.16}
.hl.road{stroke:#a4e69b;stroke-dasharray:7 5;fill:#a4e69b;fill-opacity:.14}
.hl.sea{stroke:#8fe0f2;stroke-opacity:.7;stroke-width:2;stroke-dasharray:3 6;fill:#8fe0f2;fill-opacity:.1}
.hl.seamv{stroke:#8fe0f2;stroke-opacity:.85;stroke-width:2;stroke-dasharray:3 6;fill:#8fe0f2;fill-opacity:.16}
.hl[data-sea]{pointer-events:all;cursor:pointer}
.shipm{cursor:pointer}
.shipm.dim{opacity:.55}
.hl.sel{stroke:#f1d48c;stroke-width:4.5;fill:#f1d48c;fill-opacity:.12;filter:drop-shadow(0 0 5px rgba(241,212,140,.9))}
.hl.tsel{stroke:#fff;stroke-width:4.5;stroke-dasharray:none;fill:#fff;fill-opacity:.18}
.bg{pointer-events:none}
.bg .pl{stroke:#f4ead0;stroke-opacity:.9;stroke-width:1.5}
.bg.dim{opacity:.5}
.tn{font-family:var(--f-n);font-weight:700;font-size:15px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:2.6px;stroke-linejoin:round}
.cty{fill:#f7efd6;stroke:#1a1405;stroke-width:1.1;stroke-linejoin:round}
.cap{fill:var(--gold2);stroke:#000;stroke-opacity:.55;stroke-width:.8}
.pip{fill:#0d1114;fill-opacity:.7;stroke:#f1d48c;stroke-width:1.2}
.pip.on{fill:#f1d48c}
.nm{pointer-events:none;font-family:var(--f-b);font-weight:700;font-size:11.5px;fill:#fff;paint-order:stroke;stroke:rgba(5,10,12,.9);stroke-width:3.4px;stroke-linejoin:round}
.mapsvg .nm.l2,.mapsvg .nm.l1{display:none}
.mapsvg.z2 .nm.l2{display:inline}
.mapsvg.z1 .bg.neu{display:none}
.gh{grid-column:1/-1;margin:16px 0 0;font-size:15px;letter-spacing:.25em;color:var(--gold)}
.mapsvg.z3 .nm.l2,.mapsvg.z3 .nm.l1{display:inline}
.march{fill:none;stroke-width:7;stroke-linecap:round;pointer-events:none}
.march.mv{stroke:#3b8bff}
.march.at{stroke:#e2402f}
.marchc{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-opacity:.9;filter:drop-shadow(0 2px 3px rgba(0,0,0,.65));pointer-events:none}
.bull{pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.mapsvg.z1 .tok{display:none}
.mapsvg:not(.z1) .pill{display:none}
.mn{font-family:var(--f-l);font-size:44px;letter-spacing:.6em;fill:#cfe4ea;opacity:.1;pointer-events:none}
.fx{pointer-events:none}
.fr{fill:none;stroke-width:5}
.fx.win .fr{stroke:var(--gold2)} .fx.lose .fr{stroke:var(--bad)}
.fx .sp{stroke-width:4;stroke-linecap:round}
.fx.win .sp{stroke:#fff3c9} .fx.lose .sp{stroke:#ffb4a8}
@media (prefers-reduced-motion:no-preference){
  .hl.land,.hl.road,.hl.sea,.hl.seamv{animation:none}
  .fr,.fx .sp{transform-box:fill-box;transform-origin:center;animation:burst .85s ease-out forwards}
  .fr.b{animation-delay:.15s;animation-duration:.9s}
}
.bigmap .hud{display:none}
.bigres{display:none}
.bigmap .bigres{display:grid;position:absolute;left:8px;top:8px;right:8px;z-index:3;gap:4px}
.bigmap .bigres .rc{padding:2px 6px 2px 4px;background:rgba(8,18,22,.85)}
.bigmap .bigres .rc .ic{width:16px;height:16px}
.bigmap .bigres .v{font-size:15px}
.bigmap .bigres .dl{font-size:9.5px}
.bigmap .legend{top:52px}
.bigmap .zoom{top:92px;max-height:calc(100% - 102px)}
.bigmap:not(.bigsel) .panel{display:none}
.bigmap.bigsel .stage{position:relative}
.bigmap.bigsel .panel{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:38vh;max-height:38dvh;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
.bigmap .mapwrap{min-height:0}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(2.8);opacity:0}}
.keyl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.keyl i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}

_add(60, _mk("henry2", "亨利二世建立金雀花帝國", ['eng','fra','norm','scand'], "亨利二世從英格蘭到比利牛斯山，掌握了比法王更大的領地——金雀花王朝成立。法庭與王室法律的建立，讓英格蘭走向中央集權。", ["改革司法與稅制", -20, 5, 0, "王室法庭讓秩序更穩，稅收增加。"], ["擴軍，威脅鄰國", -25, -1, 4, "你擴大了軍隊。"]));
_add(62, _mk("sanjar", "桑賈爾去世", ['seljuk','kara','ghaz','rum'], "1157 年，大塞爾柱最後一位強大的蘇丹桑賈爾去世。他死後，帝國分裂為各地的阿塔貝伊政權，花剌子模趁機崛起。", ["收編舊臣", -20, 3, 2, "舊臣的支持讓你的統治更穩。"], ["趁亂擴張", -20, -2, 3, "你把軍隊開往空虛的邊境。"]));
_add(67, _mk("kalachuri", "德干的動盪", ['chal','chola','gaha'], "西遮婁其王朝被卡拉丘里人篡位，各地諸侯趁機割據。南印度的政治版圖在短時間內變得支離破碎。", ["招撫舊部", -20, 3, 0, "你以金錢招撫舊部。"], ["出兵平亂", -25, -1, 4, "你調兵平亂。"]));
_add(72, _mk("lombard", "倫巴底同盟", ['hre','ita','fra','byz'], "北義大利的城市結成倫巴底同盟，在1176年的萊尼亞諾戰役中擊敗了皇帝的騎士。市民的步兵擊潰了貴族的騎兵，一個新時代的徵兆。", ["支持城市同盟", -20, 3, 3, "市民的熱情提高了防務。"], ["站在皇帝一邊", -15, 0, 3, "你選擇了傳統的封建秩序。"]));
_add(74, _mk("saladin", "薩拉丁掌權埃及", ['fat','seljuk'].concat(CHR), "1169 年，庫爾德將軍薩拉丁成為法蒂瑪王朝的宰相，不久後廢黜哈里發，建立阿尤布王朝。埃及與敘利亞開始連成一體——十字軍國家的包圍圈正在合攏。", ["整合埃及與敘利亞的資源", -20, 5, 3, "統一的力量增強了軍隊。"], ["保持觀望", 10, 0, 0, "你靜待局勢變化。"]));
_add(75, _mk("becket", "聖托馬斯・貝克特被殺", ['eng','fra','hre','ita'], "坎特伯里大主教貝克特在大教堂內被亨利二世的騎士殺害，震驚了整個基督教世界。國王最終赤腳懺悔，承認教會的豁免權。", ["公開懺悔，贏得民心", -10, 6, 0, "你的謙卑贏得了人們的諒解。"], ["壓下風波", 10, -4, 0, "你用強硬的手段壓住了輿論。"]));
_add(79, _mk("narapati", "蒲甘的黃金時代", ['pagan','dali','khmer','pala'], "蒲甘國王那羅波帝悉都在位，佛塔在伊洛瓦底江平原上林立，與錫蘭的佛教往來密切，國力與威望達到頂點。", ["興建佛塔，祈求安康", -25, 6, 0, "佛塔落成，百姓安居。"], ["擴張軍備", -20, 0, 4, "你把資源投向軍隊。"]));
_add(81, _mk("myriokephalon", "密列奧塞法隆戰役", ['byz','rum','seljuk'], "1176 年，曼努埃爾一世的大軍在安那托利亞山口被魯姆蘇丹基利傑・阿爾斯蘭二世伏擊。這一仗結束了拜占庭收復小亞細亞腹地的希望。", ["重整軍力", -25, 0, 4, "你從殘兵中重新編組軍隊。"], ["以外交挽回", -15, 2, 0, "你用談判保住了邊境。"]));
_add(82, _mk("champa_angkor", "占婆海軍襲擊吳哥", ['champa','khmer','dai'], "1177 年，占婆人沿湄公河與洞里薩湖駕船突襲，洗劫吳哥。高棉陷入危機，直到年輕的闍耶跋摩七世起兵復國。", ["以船艦固守", -25, 2, 3, "你加強了水路防守。"], ["報復性反攻", -25, -2, 4, "你調動軍隊準備反擊。"]));
_add(86, _mk("jayavarman", "闍耶跋摩七世建立大城", ['khmer','champa','pagan','dai'], "闍耶跋摩七世擊敗占婆，登基後興建吳哥通王城與巴戎寺，並修築道路、醫院與驛站。高棉帝國達到鼎盛。", ["大興土木，福澤百姓", -30, 7, 0, "人民得到醫院與道路，民心大振。"], ["以軍力擴張", -25, 0, 5, "你擴編軍隊，準備遠征。"]));
_add(90, _mk("dannoura", "壇之浦之戰", ['jpn','gor','song'], "1185 年，源氏在壇之浦海戰中擊敗平氏，平氏滅亡。年幼的安德天皇與三神器之一的寶劍沉入海底。武士取代貴族，成為日本的新統治階層。", ["讓武士掌權", -20, 3, 4, "武士團成為你軍力的核心。"], ["依靠宮廷貴族", 10, -3, 0, "你維持了舊秩序，武士們心懷不滿。"]));
_add(91, _mk("ghur", "古爾王朝滅伽色尼", ['ghaz','kara','gaha','seljuk','chal'], "古爾王朝的穆罕默德攻下拉合爾，伽色尼王朝滅亡。他即將以閃電般的速度擊潰印度北部的拉其普特諸侯，伊斯蘭勢力將深入恆河平原。", ["嚴守關隘", -25, 2, 4, "你強化了西北方的防禦。"], ["收買諸侯", -20, 0, 2, "你用金錢換取了一些忠誠。"]));
_add(94, _mk("crusade3", "第三次十字軍", ['fra','hre','eng','ita','scand','byz'], "「獅心王」理查、法王腓力二世與德皇腓特烈一世各自出發。腓特烈在途中溺水而亡，德軍大半潰散；理查與薩拉丁則在海岸邊展開精彩的對峙。", ["參加遠征", -40, 5, -4, "大軍遠征，折損不少，但聲望大增。"], ["捐款即可", -15, 1, 0, "你以捐款代替出兵。"]));
_add(96, _mk("arsuf", "阿爾蘇夫戰役", CHR.concat(MUS), "理查一世的騎士在阿爾蘇夫挺過了穆斯林弓騎兵的反覆騷擾，最後一擊潰敵，但並沒有奪回耶路撒冷。軍隊的紀律與補給，往往比一時的勇敢更重要。", ["整備補給線", -20, 2, 3, "你把糧秣與軍械運到前線。"], ["冒進", 10, -2, 0, "你的先鋒太過心急，留下了損失。"]));
_add(97, _mk("kamakura", "鎌倉幕府成立", ['jpn','gor','song'], "源賴朝被朝廷任命為征夷大將軍，在鎌倉開設幕府。日本進入了數百年的武家政治，天皇仍在京都，但實權落在武士手中。", ["鞏固幕府體制", -20, 5, 3, "地方的守護與地頭穩住了秩序。"], ["保持朝廷權威", 10, -2, 0, "你維持了舊制度，武士不滿。"]));
_add(99, _mk("hohenstaufen", "霍亨斯陶芬奪取西西里", ['norm','hre','ita','byz'], "1194 年，亨利六世進入巴勒莫，諾曼王朝的西西里王國落入霍亨斯陶芬家族手中。地中海中心的兩個王權合而為一，教宗感到被包圍。", ["適應新秩序", -10, 2, 0, "你接受新局面，換取互惠。"], ["抵制外來統治", -20, 2, 4, "你組織了本地的抵抗。"]));
_add(103, _mk("innocent", "英諾森三世即位", LATIN, "英諾森三世登上教宗寶座，他宣稱教宗的權力高於一切君主。他命令歐洲各國出兵十字軍，同時又在義大利與法蘭西到處介入政治。", ["服從教廷", -20, 4, 0, "教宗賜予你「虔誠」的名聲。"], ["捍衛君權", 10, -3, 0, "你與教廷關係變得緊張。"]));
_add(107, _mk("crusade4", "第四次十字軍出發", ['fra','ita','hre','byz','hung'], "1202 年，十字軍在威尼斯集結，卻付不起船資。總督多爾多提出條件：先幫威尼斯奪回扎拉，再談其他。聖地漸漸從路線圖上消失。", ["出資支持", -25, 2, 0, "你的金幣送出，換來盟友的善意。"], ["拒絕參與", 10, -1, 0, "你不願為這種交易花錢。"]));
_add(110, _mk("lat4", "拉丁帝國建立", ['byz','ita','hung','rum','kiev'], "君士坦丁堡落入十字軍手中，威尼斯與法蘭克騎士瓜分了帝國的土地。拜占庭流亡政權在尼西亞、特拉比松與伊庇魯斯等地分別建立。", ["爭奪遺產", -30, 0, 4, "你從衰落的帝國中搶得一些資源。"], ["保持中立", 10, 0, 0, "你保持距離。"]));
_add(117, _mk("tolosa", "拉斯納瓦斯・德托洛薩戰役", ['cas','almor','fat','fra','hre'], "1212 年，卡斯提爾、阿拉貢與納瓦拉的聯軍在拉斯納瓦斯擊潰穆瓦希德大軍，伊比利半島的力量平衡徹底改變，再征服運動進入決定性階段。", ["趁勝追擊", -25, 5, 4, "你下令乘勝擴張。"], ["重整防務", -15, 0, 3, "你加強邊境防線。"]));
_add(120, _mk("magna", "《大憲章》簽署", ['eng','fra','scand'], "英王約翰在朗尼米德被諸侯逼簽《大憲章》，承諾國王也要受法律約束。條款的原意是保護貴族，卻為日後的議會制度播下了種子。", ["接受限制，爭取支持", -10, 5, 0, "諸侯的支持讓內政更為穩固。"], ["設法推翻條款", -15, -3, 3, "你尋求教廷的支持廢除條款。"]));
_add(121, _mk("pandya", "潘迪亞復興", ['chola','srivijaya','chal'], "朱羅王朝在西邊與北邊的壓力下逐漸衰弱，南方的潘迪亞人重新抬頭。南印度的霸權即將易主。", ["動員防衛", -25, 3, 4, "你緊急動員了軍隊。"], ["談判分贓", -10, -2, 0, "你割讓一部分土地，換取暫時的平靜。"]));
_add(124, _mk("khwarezm", "蒙古西征花剌子模", ['kara','ghaz','seljuk','kiev'], "蒙古商隊在訛答剌被花剌子模總督殺害，成吉思汗親率大軍西征。布哈拉、撒馬爾罕、梅爾夫與尼沙布爾一座接一座陷落，花剌子模在兩年內滅亡。", ["堅壁清野", -30, 0, 5, "你加固城池，疏散鄉村的糧食。"], ["遣使稱臣", -20, -4, 0, "你送去貢品，換取暫時的平安。"]));
_add(125, _mk("damietta", "第五次十字軍：達米埃塔", ['hung','hre','fat','byz','ita'], "十字軍改道進攻埃及，圍攻尼羅河口的達米埃塔。他們一度占領城市，卻在向開羅進軍時被尼羅河的洪水困住，被迫撤退。", ["派船運送補給", -25, 2, 3, "你的船隊趕到了河口。"], ["不介入", 10, 0, 0, "你不願意為遠方的戰事花錢。"]));
_add(127, _mk("goldenbull", "匈牙利《金璽詔書》", ['hung','pol','hre','byz'], "1222 年，貴族迫使匈牙利國王安德魯二世簽署《金璽詔書》，承認貴族的免稅權與抵抗權。匈牙利成為歐洲最早限制王權的國家之一。", ["接受，穩住貴族", -10, 5, 0, "貴族們很滿意，內部安定了。"], ["強硬壓制", -15, -3, 3, "你的王權更集中，但貴族懷恨在心。"]));
_add(132, _mk("chinggis_death", "成吉思汗去世", ['kara','ghaz','xia','jin','song','liao','kiev','seljuk'], "1227 年，成吉思汗在攻打西夏的途中去世。西夏隨即滅亡，帝國分給諸子。蒙古的擴張沒有停止，反而進入更有組織的階段。", ["趁亂喘息", -15, 3, 3, "你抓緊時間整頓邊防。"], ["主動出擊", -25, -2, 4, "你調兵向前線推進。"]));
_add(134, _mk("crusade6", "第六次十字軍：腓特烈二世", ['hre','fat','ita','norm'], "被革除教籍的腓特烈二世沒有流一滴血，就用談判換來耶路撒冷、伯利恆與拿撒勒的控制權。教廷憤怒，穆斯林也不滿——一場空前絕後的外交十字軍。", ["談判為先", -20, 4, 0, "外交手段讓你在聖地得到了一席之地。"], ["反對這樁交易", 10, -2, 0, "你選擇與教廷站在同一陣線。"]));
_add(139, _mk("jin_fall", "金朝滅亡", ['song','jin','gor','xia'], "1234 年，蒙古與南宋聯軍攻陷蔡州，金哀宗自縊，金朝滅亡。但南宋很快發現：新的鄰居比舊的更危險。", ["趁勢收復中原", -30, 3, 4, "你的軍隊北上，收復了一部分故土。"], ["固守長江", -15, 0, 3, "你選擇穩守淮河與長江。"]));
_add(142, _mk("rus", "蒙古征服羅斯", ['kiev','pol','hung','scand','hre'], "1237 年，拔都率軍進攻羅斯諸公國，梁贊、莫斯科、弗拉基米爾相繼陷落，1240 年基輔被毀。歐洲東部的城市化進程被拋回數十年前。", ["死守城池", -30, 0, 5, "你傾全力加固城防。"], ["向西避難，保存實力", -10, -4, 2, "你放棄邊境，保存主力。"]));
_add(143, _mk("sukhothai", "素可泰王國建立", ['khmer','pagan','champa','dali'], "1238 年，傣族首領在昭披耶河流域建立素可泰王國，擺脫高棉的統治。大陸東南亞的版圖開始重組，上座部佛教逐漸成為主流信仰。", ["承認新勢力，貿易為先", -10, 3, 0, "你與新興勢力做起生意。"], ["出兵鎮壓", -25, -2, 4, "你調動軍隊，意圖恢復秩序。"]));
_add(146, _mk("legnica", "列格尼察與莫希之戰", ['pol','hung','hre','byz','kiev'], "1241 年，蒙古軍在列格尼察擊潰波蘭與日耳曼騎士，隨後在莫希殲滅匈牙利軍。窩闊台的死訊傳來，蒙古軍才突然撤退——歐洲因此逃過一劫。", ["趁勢重建", -25, 3, 4, "你利用蒙古人退去的機會重整軍隊。"], ["把握時機遷都", -10, 1, 0, "你把重心移向安全的地區。"]));
_add(149, _mk("jerusalem44", "花剌子模人攻陷耶路撒冷", CHR.concat(MUS), "1244 年，被蒙古人驅逐的花剌子模騎兵攻入耶路撒冷，聖城再度易主。法王路易九世為此發誓，要組織新一輪十字軍。", ["響應號召", -30, 4, 3, "你備齊了遠征物資。"], ["袖手旁觀", 10, 0, 0, "你把錢留在國庫。"]));
_add(155, _mk("mamluk", "馬木路克奪權", ['fat','seljuk','rum'], "1250 年，埃及的馬木路克將領殺死阿尤布蘇丹，建立馬木路克蘇丹國。這些以奴隸出身的騎兵統治著尼羅河，並將成為蒙古西進的終點。", ["擴編馬木路克軍團", -30, 2, 5, "精銳騎兵進駐了你的首都。"], ["維持舊制", 10, -2, 0, "你保持原有的軍制。"]));
_add(165, _mk("ainjalut", "艾因賈魯特戰役", ['fat','seljuk','rum'].concat(CHR), "1260 年，馬木路克軍隊在加利利的艾因賈魯特擊敗蒙古軍，這是蒙古人第一次在野戰中被大規模擊潰。西進的腳步被擋在敘利亞。", ["趁機鞏固", -20, 5, 3, "你加強了與馬木路克的聯繫。"], ["保持中立", 10, 0, 0, "你不願捲入這場大戰。"]));
_add(176, _mk("yuan", "忽必烈建立元朝", ['song','gor','jpn','dai','champa','pagan'], "1271 年，忽必烈定國號為「大元」，並著手滅宋。蒙古人的視野不再只是草原，而是整個東亞與東南亞的海岸線。", ["積極備戰", -30, 0, 5, "你加速徵兵、修城。"], ["遣使稱臣", -20, -3, 0, "你選擇以貢品換取時間。"]));
_add(179, _mk("bunei", "文永之役", ['jpn','gor','song'], "1274 年，元與高麗聯軍渡海進攻對馬、壹岐與博多灣。日本武士慣用單打獨鬥，面對集團戰術和火器吃了虧，一夜暴風雨又將艦隊吹走。", ["在海岸建築防壘", -25, 3, 4, "石壘在博多灣沿岸築起。"], ["增派御家人", -15, -1, 3, "你徵召地方武士。"]));

_add(193, _mk("bachdang", "白藤江之戰", ['dai','champa','khmer','song'], "1288 年，陳興道在白藤江口設下木樁，趁退潮時將元軍艦隊困在河口一舉殲滅。越南三度擊退蒙古，成為東南亞少數沒有被征服的大國。", ["設置江中木樁", -15, 6, 3, "你把水文與地形化為自己的武器。"], ["追擊敵軍", -20, 2, 2, "你的軍隊乘勝追擊。"]));

_add(85, _mk("oranmiyan", "奧蘭米揚入主貝寧", ['ben', 'yor'], "約 1180 年，伊費的王子奧蘭米揚被貝寧貴族迎立為王，從此兩地的王室血脈相連，宮廷與工匠製作的銅雕名聞西非。", ["資助宮廷工坊", -20, 4, 0, "銅雕與象牙工藝讓王都聲名遠播。"], ["專心整頓邊境", 10, 0, 2, "貴族們安分了，邊境的守軍也增加了。"]));
_add(90, _mk("sosso", "蘇蘇王國崛起", ['gha', 'gao', 'mak'], "約 1180 年，蘇蘇國王蘇曼古魯征服了衰弱的迦納，西非草原的權力重新洗牌。金礦、鹽與商路的控制權成了新的爭奪目標。", ["結盟抗衡", -20, 3, 2, "各部落願意聯手，商路暫時守住了。"], ["趁亂擴充商隊", 15, -2, 0, "亂世中商隊照樣賺錢，只是民心不安。"]));
_add(105, _mk("lalibela", "拉利貝拉岩石教堂", ['eth', 'mak', 'alo'], "約 1200 年，衣索比亞的扎格威王朝在高原上開鑿岩石教堂，把一整座山鑿成了聖城。信仰與王權在石頭中合而為一。", ["傾國力建造", -30, 8, 0, "岩石教堂落成，朝聖者從四方而來。"], ["量力而為", 5, 1, 0, "只修了幾座小教堂，國庫無損。"]));

_add(140, _mk("mali", "松迪亞塔與馬里帝國", ['gha', 'gao', 'kan', 'hau'], "1235 年，松迪亞塔在基里納擊敗蘇蘇，建立馬里。新帝國控制黃金與鹽的商路，西非草原進入一個以大帝國為中心的時代。", ["順勢投靠新帝國", 20, -2, 0, "朝貢換來了商路特權。"], ["堅守自己的商路", -20, 3, 2, "你守住了自己的城市與驕傲。"]));
_add(155, _mk("zimbabwe", "大津巴布韋的石城", ['zim', 'kil', 'kon'], "約 13 世紀，南部非洲高原上的統治者用不加灰漿的石塊堆起巨大的圍牆。黃金、牲畜與印度洋的貿易，讓這座石城成為區域的中心。", ["擴建石城與牛群", -20, 5, 0, "石牆更高、牛群更盛，民心高昂。"], ["與沿海商人交易黃金", 25, -2, 0, "黃金換來絲綢與珠寶，國庫進帳。"]));

  if (!ev) {

    var f = g.player;
    var pool = EVENTS.filter(function (e) { return e.id !== g.lastEv && (!e.cond || e.cond(g, f)); });
    var tot = 0; pool.forEach(function (e) { tot += e.w; });

function scoreOf(g, f) {
  var regs = owned(g, f), lv = 0, tr = 0;
  regs.forEach(function (id) { lv += g.p[id].L; tr += g.p[id].t; });
  var fs = g.fac[f];
  return Math.round(regs.length * 3 + lv * 4 + tr * 0.3 + fs.gold / 30 + fs.morale / 10);
}
function finish(g, reason, winner) {
  var scores = {};
  FIDS.forEach(function (f) { scores[f] = scoreOf(g, f); });
  if (!winner) {
    var bf = null;
    FIDS.forEach(function (f) { if (g.fac[f].alive && (bf === null || scores[f] > scores[bf])) bf = f; });
    winner = bf;
  }
  g.over = { reason: reason, winner: winner, scores: scores, playerWon: winner === g.player, regions: {} };
  FIDS.forEach(function (f) { g.over.regions[f] = ownedN(g, f); });
  return g.over;
}
function checkEnd(g) {
  refreshAlive(g);
  if (!humansOf(g).some(function (h) { return g.fac[h].alive; })) return finish(g, 'eliminated', null);
  for (var i = 0; i < FIDS.length; i++) if (FIDS[i] !== 'mongol' && g.fac[FIDS[i]].alive && !lordOf(g, FIDS[i]) && ownedTotal(g, FIDS[i]) >= WIN_P) { g.heg = g.heg || {}; if (!g.heg[FIDS[i]]) { g.heg[FIDS[i]] = g.turn; g.hegPending = FIDS[i]; } }
  return null;
}

  var RULES = '<ul>' +

    '<li><b>附庸</b>：實力比接壤的對手強 1.4 倍以上時，可在外交選單「要求臣服」。附庸每回合把約三成盈餘進貢給宗主、跟著宗主參戰，附庸的地塊也算進宗主的霸權地塊；附庸若覺得宗主太弱，可能宣布獨立。</li>' +
    '<li><b>補給線</b>：部隊離己方城市（沿己方領土）超過 4 格就會「遠離補給線」，多耗糧、每回合損耗兵力、攻擊力 −10%；占領城市可以延伸補給線。草原民族（蒙古等）不受此限。地圖上這類地塊的徽章會出現紅框。</li>' +
    '<li><b>徵兵</b>只能在城市進行；非城市地塊可花費金幣與糧食建城。城市等級越高，每回合可徵兵數、產出與防禦都更高；駐軍沒有硬上限，但超過軟上限（城市規模的兩倍）每回合會損耗並多耗糧。</li>' +
    '<li><b>特產</b>：山區有鐵礦、草原有戰馬、東方有絲綢、南洋有香料、西非有黃金；占有愈多，進攻力或金幣收入愈高（點地塊可看到特產）。</li>' +

    '<li><b>君主</b>：開局從你文明歷史上的君主（含傳說人物）中挑一位，各帶不同加成；金色★的名君還有專屬戰鬥能力或專屬兵種。君主在位約等於歷史年數，駕崩後從名單選繼任者。</li>' +
    '<li><b>間諜</b>：下方「間諜」按鈕，花金幣（不耗行動點、每回合一次）偵查、煽動叛亂或暗殺將領，失敗聲望 −4。</li>' +
    '<li><b>地圖按鈕</b>：「大」把地圖放到最大（再按還原）；「我」回到你最後行動的位置；結束回合後地圖會自動移到那裡。</li>' +
    '<li><b>同盟</b>：盟友的領地可以「借道」通過（只能路過，不能停留）；你進攻的目標旁若有盟友的部隊（4 人以上）、且盟友也在和同一個敵人交戰，你的攻擊 +8%（最多兩位盟友 +16%）。你被進攻時，旁邊的盟友同樣會幫你守，防禦 +8%。</li>' +
    '<li><b>海岸防禦</b>：敵人的艦隊停在你海岸領地旁時，每回合結算時你的遠程兵種（弓兵、投石機等）會射擊船隻，每約 14 點遠程戰力擊沉一艘；步兵與騎兵沒有作用，有港口的城市更準。沒有遠程兵種的海岸擋不住船。</li>' +
    '<li><b>地形</b>：山地防禦 ×1.4，丘陵 ×1.22，森林 ×1.12；平原與沙漠沒有加成。尼羅河谷糧產最高，沙漠幾乎無產出。</li>' +
    '<li><b>資源</b>：士兵每年要吃糧、領餉；糧食或金幣歸零會逃兵，民心過低會叛亂。</li>' +
    '<li><b>外交</b>：開戰前必須先宣戰。可停戰、簽互不侵犯條約、結盟、簽貿易協定、請求盟友援軍。基督教與伊斯蘭勢力之間更容易爆發戰爭，電腦勢力也會主動宣戰、結盟與求和。</li>' +
    '<li><b>將領</b>：只能從自己文明的歷史名將裡挑，開局可選一位，之後隨年代出現的新將領要在城市面板花金幣招募（最多同時 3 位）。將領要派任為軍團統帥才會隨軍出征（直接出兵不帶將領），進攻、防守、攻城、騎戰、海戰各有加成；打勝仗會升級，戰敗可能陣亡。其他勢力也有自己文明的歷史將領。</li>' +
    '<li><b>等級系統</b>：①君主聲望（上方 Lv）：攻占領地、研究學術、每年累積；每級全勢力收入 +1.5%，Lv4 與 Lv8 行動點上限各 +1。②部隊老兵（地塊面板 ★）：這塊駐軍打勝仗會升級，最高 ★★★，攻防各 +4%／級；戰敗減半，新占領地只繼承六成經驗，增援會與當地部隊平均。③武將等級（Lv1–3）：打勝仗累積經驗，等級越高加成越大。</li>'
    '<li><b>海軍</b>：戰船是海面上的艦隊單位：造船後船隻停在港口外的海面格子，點選船隻再點選藍色海面格子即可移動（每回合最遠 4 格，不能穿過敵艦，不需行動點）。點選紅色格子可攻擊敵艦。渡海運兵分四步：艦隊停在己方海岸旁 → 在艦隊面板「裝載」部隊 → 開到對岸 → 「登陸」（敵地會發生戰鬥，登陸部隊的攻擊力略低）。船上的兵隨船行動，船被擊沉就全部陣亡；裝載與登陸不耗行動點。</li>' +
    '<li><b>封鎖與海盜</b>：交戰中的敵方艦隊（或海盜）停在你港口旁的海面、兵力合計至少 2 且超過你在那裡的艦隊時，港口被封鎖（紅色「封」）：無貿易收入、每回合 −3 金幣、不能從該港運兵。海盜是在海上遊蕩的黑帆艦隊，用自己的艦隊攻擊他們即可剿滅。</li>' +
    '<li><b>學術</b>：下方「學術」按鈕花金幣研究技術，共五項（三圃制輪作 +6% 糧、市集與簿記 +6% 金、十字弩 進攻 +4%、石造城堡工法 防禦 +5%、火藥 進攻再 +4%），後面的項目要到指定年份才能研究。AI 也會研究。</li>' +
    '<li><b>圍城</b>：敵軍（交戰中）在相鄰地塊駐有不少於你駐軍六成（且至少 4 人）的兵力，你的城市就算被圍。每個圍城回合城牆效果減 15%、整體防禦減 4%，第二回合起守軍每回合缺糧減員約 5%；圍城軍退走後逐步恢復。想拿下堅城，先圍幾回合再強攻。</li>' +
    '<li><b>建築</b>：城市可蓋與城市等級同數的建築（市集、糧倉、兵營、教堂、船塢、工坊）。</li>' +
    '<li><b>地標</b>：地圖上金色或灰色的小碑是歷史地標（灰色＝遺跡）。占領那座城後可花 4 個回合修復（每回合 60 金＋15 糧、不耗行動點），修好每回合有金幣、糧食或文化加成；城市被敵人奪走就會毀損、要重修。</li>' +
    '<li><b>古道與關隘</b>：地圖上的金色虛線是歷史大道（絲路、羅馬大道、聖雅各之路、拜占庭軍道等），走在古道上行軍花費減半；紅盾「關」是著名關隘（玉門關、潼關、布倫納山口等），守軍防禦 +15%。</li>' +

    '<li><b>駱駝騎兵</b>：沙漠與阿拉伯、北非、薩赫勒一帶的勢力（例如穆拉比特、法蒂瑪、阿拔斯、迦納、加奧、加涅姆、索馬里城邦等）的騎兵是駱駝騎兵：在沙漠不缺水損耗、行軍不減速，沙漠中進攻與防守戰力 +10%。</li>' +
    '<li><b>地形與行軍</b>：森林、丘陵、山地行軍本來就慢；騎兵越多的部隊在這些地形損失越大（森林最多多花 1 點、山地 1.5 點移動力）。進攻山地、丘陵、森林時，進攻方戰力也會打折。</li>' +
    '<li><b>城牆</b>：城市可花金幣修城牆（不超過城市等級，最高 3 級），守軍防禦每級 +18%，攻城器械可以削弱城牆效果；城破會損毀一級。</li>' +
    '<li><b>天災與民變</b>：瘟疫（1347 年起有黑死病）、饑荒、君主駕崩的繼承危機、民怨沸騰都會觸發事件。剛佔領的城市十回合內若駐軍太少，居民可能趁亂起事。</li>' +

  /* ---------- 地圖視角 ---------- */
  function mvSize() { var m = $('#mapview'); return { w: (m && m.clientWidth) || 800, h: (m && m.clientHeight) || 500 }; }
  function fitK(sz) { return Math.min(sz.w / BW, sz.h / BH); }
  function clampAxis(c, ext, lo, hi, mg) {
    var mn = lo - mg + ext / 2, mx = hi + mg - ext / 2;
    return mn > mx ? (lo + hi) / 2 : Math.max(mn, Math.min(mx, c));
  }
  function viewBox() {
    var v = ui.view, sz = mvSize();
    v.s = Math.max(1, Math.min(8, v.s));
    var k = fitK(sz) * v.s, w = sz.w / k, h = sz.h / k; ui.lk = k;
    v.cx = clampAxis(v.cx, w, BX0, BX1, 40 + w * 0.35);
    v.cy = clampAxis(v.cy, h, BY0, BY1, 40 + h * 0.35);
    return (v.cx - w / 2).toFixed(1) + ' ' + (v.cy - h / 2).toFixed(1) + ' ' + w.toFixed(1) + ' ' + h.toFixed(1);
  }
  function fnUpdate(svg) {
